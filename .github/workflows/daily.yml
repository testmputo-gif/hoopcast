name: HoopCast Daily Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to run for (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run the prediction pipeline
        env:
          TZ: Africa/Lagos
          GITHUB_OWNER: ${{ secrets.REPO_OWNER }}
          GITHUB_REPO:  ${{ secrets.REPO_NAME }}
          GITHUB_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Africa/Lagos date +%Y-%m-%d)
          fi
          echo "Running HoopCast pipeline for $DATE"
          node scripts/daily.js "$DATE"
