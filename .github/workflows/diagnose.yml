name: HoopCast System Diagnostic

on:
  # Run manually whenever you want a health check
  workflow_dispatch:
  # Also run automatically every Monday morning Nigeria time
  schedule:
    - cron: '0 6 * * 1'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run full system diagnostic
        env:
          TZ: Africa/Lagos
          GITHUB_OWNER: ${{ secrets.REPO_OWNER }}
          GITHUB_REPO:  ${{ secrets.REPO_NAME }}
          GITHUB_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
        run: node scripts/diagnose.js
